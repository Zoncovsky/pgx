# Appended after configs/pgx-ephemeral.conf for the nightly regression
# baseline (benchmarks/pgx/regress-baseline.py). PostgreSQL's own
# src/test/regress asserts on two settings the ephemeral profile turns off for
# resource containment and crash-domain reasons: select_parallel expects
# parallel workers to launch, and stats expects synchronous_commit = on. Under
# the ephemeral profile exactly those two tests report result differences;
# with these restored the engine shows none. Everything else in the profile
# (shared_buffers, fsync = off, wal_level = minimal, ...) stays as shipped.
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
synchronous_commit = on
