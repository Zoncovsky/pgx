[package]
name = "pgx"
version = "0.1.2"
edition.workspace = true
publish.workspace = true
description = "PGX command-line interface: a local, disposable, PostgreSQL-compatible runtime"

[[bin]]
name = "pgx"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
